apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hackhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: hackhub-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: hackhub-config
                  key: BACKEND_URL
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hackhub
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
