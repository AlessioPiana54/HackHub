server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Railway termina TLS a livello edge — nginx gestisce solo HTTP interno
    # HSTS rimosso (gestito da Railway)
    add_header Content-Security-Policy   "default-src 'self' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Tutte le route Angular → index.html (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy chiamate API verso il backend (URL iniettato via BACKEND_URL al runtime)
    location /api/ {
        proxy_pass         ${BACKEND_URL}/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
