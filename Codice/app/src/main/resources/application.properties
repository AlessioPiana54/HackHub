spring.application.name=hackhub

# Il profilo attivo si imposta tramite env var SPRING_PROFILES_ACTIVE (dev | prod)
# Default: dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Porta: Railway inietta PORT dinamicamente, default 8080 per sviluppo locale
server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hackhub}
spring.datasource.username=${DB_USERNAME:hackhub}
spring.datasource.password=${DB_PASSWORD:hackhub}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA comune
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:hackhub-dev-secret-key-min-32-chars!!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS (virgola-separato per ambienti multipli)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
