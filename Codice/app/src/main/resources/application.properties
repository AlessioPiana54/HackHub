spring.application.name=hackhub

# Il profilo attivo si imposta tramite env var SPRING_PROFILES_ACTIVE (dev | prod)
# Default: dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Porta HTTP: sovrascrivibile con la variabile PORT, default 8080
server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hackhub}
spring.datasource.username=${DB_USERNAME:hackhub}
spring.datasource.password=${DB_PASSWORD:hackhub}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA comune
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
# Nessun default: in prod JWT_SECRET è obbligatorio (il default di sviluppo è in application-dev.properties)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS (virgola-separato per ambienti multipli)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
