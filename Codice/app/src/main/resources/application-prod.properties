# ── PROFILO PRODUZIONE ───────────────────────────────────────────────────────
# Attivato quando SPRING_PROFILES_ACTIVE=prod
# Tutte le variabili sensibili devono essere iniettate dall'ambiente (mai hardcoded).

# Flyway: gestisce le migrazioni DB versionate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Schema: Hibernate non tocca mai lo schema — lo gestisce solo Flyway
spring.jpa.hibernate.ddl-auto=validate

# No SQL logging in produzione
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP — connection pool ottimizzato
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HackHubPool

# Actuator: espone solo health (senza dettagli interni)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator

# Logging strutturato — solo WARN+ per librerie terze, INFO per l'applicazione
logging.level.root=WARN
logging.level.hackhub=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
