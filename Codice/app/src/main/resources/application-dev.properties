# ── PROFILO SVILUPPO ─────────────────────────────────────────────────────────
# Attivato quando SPRING_PROFILES_ACTIVE=dev (default locale)

# Flyway disabilitato in dev: lo schema è gestito da Hibernate (più comodo)
spring.flyway.enabled=false

# Schema: Hibernate ricrea/aggiorna automaticamente (OK per dev, MAI in prod)
spring.jpa.hibernate.ddl-auto=update

# SQL logging — visibile in console durante sviluppo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator: tutti gli endpoint esposti in dev
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Log level applicativo
logging.level.hackhub=DEBUG
logging.level.org.hibernate.SQL=DEBUG
